<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · Complemento</title><style>body{font:16px system-ui;margin:30px auto;max-width:420px;padding:16px;color:#20242b}input,button{display:block;box-sizing:border-box;width:100%;font-size:17px;padding:15px;margin:12px 0;border-radius:10px}input{border:1px solid #ccc}button{background:#e95380;color:white;border:0;font-weight:700}#status{white-space:pre-wrap;line-height:1.5}</style></head><body><h1>Ingresar a Complemento</h1><p>Usá tu cuenta administradora.</p><form id="form"><label>Correo<input id="email" type="email" required autocomplete="email" value="complementomdp@gmail.com"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button id="submit">Ingresar</button></form><p><a href="recuperar.html" style="color:#b93667">¿Olvidaste tu contraseña?</a></p><p id="status" role="status" aria-live="polite">Completá tus datos y tocá Ingresar.</p><script src="supabase-config.js?v=2"></script><script>document.getElementById('form').onsubmit=async function(e){e.preventDefault();const out=document.getElementById('status'),btn=document.getElementById('submit');out.textContent='Comprobando acceso…';btn.disabled=true;try{const cfg=window.COMPLEMENTO_DB;if(!cfg)throw Error('No se cargó la configuración.');const r=await fetch(cfg.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Credenciales incorrectas');const check=await fetch(cfg.url+'/rest/v1/complemento_admins?select=user_id&limit=1',{headers:{apikey:cfg.key,Authorization:'Bearer '+d.access_token}});if(!check.ok)throw Error('No se pudo verificar el permiso.');const rows=await check.json();if(!rows.length)throw Error('La cuenta no tiene permiso de administrador.');sessionStorage.setItem('complemento_access_token',d.access_token);localStorage.setItem('complemento_access_token',d.access_token);out.textContent='Acceso correcto. Abriendo panel…';location.replace('administracion-v2.html')}catch(err){out.textContent='No se pudo ingresar: '+err.message}finally{btn.disabled=false}};</script></body></html>
