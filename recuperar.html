<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar contraseña · Complemento</title><style>body{font:16px system-ui;max-width:420px;margin:32px auto;padding:16px;color:#222}input,button{display:block;box-sizing:border-box;width:100%;padding:15px;margin:12px 0;font-size:17px;border-radius:10px}input{border:1px solid #ccc}button{border:0;background:#d95883;color:#fff;font-weight:bold}p{line-height:1.5}#status{white-space:pre-wrap}a{color:#b73565}</style></head><body><h1>Recuperar contraseña</h1><p id="help">Te enviaremos un enlace a tu correo para elegir una nueva contraseña.</p><form id="request"><label>Correo electrónico<input id="email" type="email" value="complementomdp@gmail.com" required></label><button>Enviar enlace de recuperación</button></form><form id="change" hidden><label>Contraseña nueva<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><button>Guardar nueva contraseña</button></form><p id="status" role="status" aria-live="polite"></p><a href="ingresar.html">Volver a ingresar</a><script src="supabase-config.js?v=2"></script><script>const cfg=window.COMPLEMENTO_DB,out=document.getElementById('status'),hash=new URLSearchParams(location.hash.slice(1)),token=hash.get('access_token'),type=hash.get('type');if(token&&type==='recovery'){document.getElementById('request').hidden=true;document.getElementById('change').hidden=false;document.getElementById('help').textContent='Elegí tu contraseña nueva.'}document.getElementById('request').onsubmit=async e=>{e.preventDefault();out.textContent='Enviando…';try{const r=await fetch(cfg.url+'/auth/v1/recover',{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||'Error '+r.status);out.textContent='Solicitud enviada. Revisá tu correo y la carpeta Spam. El enlace debe llevarte de regreso a esta página para establecer la contraseña.'}catch(err){out.textContent='No se pudo enviar: '+err.message}};document.getElementById('change').onsubmit=async e=>{e.preventDefault();out.textContent='Actualizando…';try{const r=await fetch(cfg.url+'/auth/v1/user',{method:'PUT',headers:{apikey:cfg.key,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||'Error '+r.status);history.replaceState(null,'',location.pathname);out.textContent='Contraseña actualizada. Ya podés ingresar al panel.';document.getElementById('change').hidden=true}catch(err){out.textContent='No se pudo actualizar: '+err.message}};</script></body></html>
