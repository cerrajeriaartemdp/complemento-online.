<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro Complemento</title><style>body{font:16px system-ui;margin:30px auto;max-width:420px;padding:15px}input,button{display:block;width:100%;box-sizing:border-box;padding:14px;margin:12px 0;font-size:17px}button{background:#e95380;color:white;border:0;border-radius:10px}#status{white-space:pre-wrap}</style></head><body><h1>Crear cuenta</h1><p>Registrate para solicitar acceso al panel.</p><form id="form"><label>Correo<input id="email" type="email" required autocomplete="email"></label><label>Contraseña<input id="password" type="password" minlength="6" required autocomplete="new-password"></label><button>Crear cuenta</button></form><p id="status" role="status"></p><a href="admin.html">Volver al panel</a><script src="supabase-config.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('status');out.textContent='Procesando…';try{const cfg=window.COMPLEMENTO_DB;if(!cfg)throw Error('Falta configuración de conexión');const response=await fetch(cfg.url+'/auth/v1/signup',{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const result=await response.json();if(!response.ok)throw Error(result.message||result.msg||'Error '+response.status);out.textContent='Cuenta solicitada. Revisá tu correo y confirmalo si recibís un mensaje.'}catch(err){out.textContent='No se pudo crear la cuenta: '+err.message}});</script></body></html>
