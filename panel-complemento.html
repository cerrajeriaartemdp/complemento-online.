<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complemento · Panel</title><style>body{font:16px system-ui;background:#f5f6f7;color:#19242a;margin:0}header{background:white;padding:18px;border-bottom:1px solid #ddd;font-weight:800;font-size:23px}header span{color:#e55b83}main{max-width:900px;margin:auto;padding:20px}input,textarea,select,button{font:inherit;box-sizing:border-box;padding:12px;border:1px solid #ccd4d9;border-radius:10px;max-width:100%}input,textarea,select{width:100%}button{background:#18242a;color:white;cursor:pointer;border:0}button:disabled{opacity:.5}.item{background:white;border:1px solid #dce1e4;padding:16px;border-radius:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid label{font-size:13px;display:grid;gap:5px}.wide{grid-column:1/-1}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}#status{white-space:pre-wrap;color:#a34223}img{width:100px;height:100px;object-fit:contain}.item button{background:#e55b83}a{color:#b93568}</style></head><body><header>comple<span>mento.</span> <small style="font-size:13px;font-weight:400">Administración</small></header><main><h1>Productos</h1><p id="status">Verificando tu sesión…</p><section id="access" hidden><p>Iniciá sesión para administrar los productos.</p><p><a href="ingresar.html?v=panel-nuevo">Ir al inicio de sesión</a></p></section><section id="workspace" hidden><div class="row"><button id="new">+ Agregar producto</button><button id="logout">Cerrar sesión</button></div><p id="count"></p><div id="items"></div></section></main><script src="supabase-config.js?v=2"></script><script>
const cfg=window.COMPLEMENTO_DB,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),token=sessionStorage.getItem('complemento_access_token')||localStorage.getItem('complemento_access_token')||'';
let products=[];
async function api(path,method='GET',body){const r=await fetch(cfg.url+'/rest/v1/'+path,{method,headers:{apikey:cfg.key,Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.text()).slice(0,300));return r.status===204?[]:r.json()}
function render(){ $('#count').textContent=products.length+' productos';$('#items').innerHTML=products.map((p,i)=>'<article class="item" data-index="'+i+'"><div class="row"><strong>'+esc(p.name||'Nuevo producto')+'</strong><span>'+esc(p.sku)+'</span></div><div class="grid"><label class="wide">Nombre<input data-field="name" value="'+esc(p.name)+'"></label><label>Precio ($)<input type="number" min="0" data-field="price" value="'+(Number(p.price)||0)+'"></label><label>Stock<input type="number" min="0" data-field="stock" value="'+(p.stock??'')+'"></label><label>Marca<input data-field="brand" value="'+esc(p.brand)+'"></label><label>Categoría<input data-field="category" value="'+esc(p.category)+'"></label><label class="wide">Descripción<textarea data-field="description">'+esc(p.description)+'</textarea></label><label class="wide">URL de imagen<input data-field="image_url" value="'+esc(p.image_url)+'"></label><label class="wide">Subir foto<input type="file" accept="image/*" data-photo></label><label>Visible<select data-field="active"><option value="true" '+(p.active?'selected':'')+'>Sí</option><option value="false" '+(!p.active?'selected':'')+'>No</option></select></label><label>Destacado<select data-field="featured"><option value="true" '+(p.featured?'selected':'')+'>Sí</option><option value="false" '+(!p.featured?'selected':'')+'>No</option></select></label></div><div class="row" style="margin-top:14px">'+(p.image_data||p.image_url?'<img src="'+esc(p.image_data||p.image_url)+'" alt="">':'')+'<button data-save="'+i+'">Guardar producto</button></div><p class="result"></p></article>').join('')}
async function start(){try{if(!cfg)throw Error('No se cargó la configuración');if(!token){$('#status').textContent='Necesitás iniciar sesión.';$('#access').hidden=false;return}const rows=await api('complemento_admins?select=user_id&limit=1');if(!rows.length)throw Error('Esta cuenta no tiene permiso para administrar.');products=await api('complemento_products?select=*&order=name.asc');$('#workspace').hidden=false;$('#status').textContent='Sesión iniciada correctamente.';render()}catch(e){$('#status').textContent='No se pudo abrir el panel: '+e.message;$('#access').hidden=false}}
$('#items').addEventListener('click',async e=>{const btn=e.target.closest('[data-save]');if(!btn)return;const card=btn.closest('.item'),i=Number(btn.dataset.save),p=products[i],get=k=>card.querySelector('[data-field="'+k+'"]').value;const next={sku:p.sku,name:get('name'),description:get('description'),price:Number(get('price'))||0,stock:get('stock')===''?null:Number(get('stock')),brand:get('brand'),category:get('category'),active:get('active')==='true',featured:get('featured')==='true',image_url:get('image_url'),image_data:p.image_data||null};btn.disabled=true;card.querySelector('.result').textContent='Guardando…';try{await api('complemento_products?on_conflict=sku','POST',next);products[i]=next;card.querySelector('.result').textContent='✓ Publicado correctamente';render()}catch(err){card.querySelector('.result').textContent='Error: '+err.message}finally{btn.disabled=false}});
$('#items').addEventListener('change',async e=>{if(!e.target.matches('[data-photo]')||!e.target.files[0])return;const card=e.target.closest('.item'),i=Number(card.dataset.index),file=e.target.files[0];try{const data=await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,640/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.7))};img.onerror=reject;img.src=url});products[i].image_data=data;card.querySelector('.result').textContent='Foto preparada. Tocá Guardar producto.'}catch(err){card.querySelector('.result').textContent='No se pudo procesar la foto.'}});
$('#new').onclick=()=>{products.unshift({sku:'producto-'+Date.now(),name:'Producto nuevo',price:0,stock:0,brand:'',category:'',description:'',active:false,featured:false,image_url:'',image_data:null});render();window.scrollTo(0,0)};
$('#logout').onclick=()=>{sessionStorage.removeItem('complemento_access_token');localStorage.removeItem('complemento_access_token');location.replace('ingresar.html')};start();
</script></body></html>
