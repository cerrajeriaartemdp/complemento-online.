<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complemento · Panel</title><style>body{font:15px system-ui,sans-serif;background:#f5f6f7;color:#19242a;margin:0;overflow-x:hidden}*{box-sizing:border-box}header{background:white;padding:15px;border-bottom:1px solid #ddd;font-weight:800;font-size:22px}header span{color:#e55b83}main{max-width:1100px;width:100%;margin:0 auto;padding:12px}input,textarea,select,button{font:inherit;padding:9px;border:1px solid #ccd4d9;border-radius:8px;max-width:100%}input,textarea,select{width:100%;min-width:0}button{background:#18242a;color:white;cursor:pointer;border:0}button:disabled{opacity:.5}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input{flex:1 1 100%}.toolbar select{flex:1 1 135px;width:auto;background:white}.category-heading{font-size:16px;margin:16px 0 6px;padding:8px 10px;background:#e9edf0;border-radius:8px}.item{width:100%;min-width:0;background:white;border:1px solid #dce1e4;border-radius:9px;margin:5px 0;overflow:hidden}.product-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:9px;align-items:start;padding:10px;width:100%;min-width:0;background:white;color:#19242a}.thumb{grid-column:1;grid-row:1;width:44px;height:44px;object-fit:contain;border-radius:7px;background:#f6f6f6}.quick-edit{grid-column:2;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;width:100%;min-width:0}.quick-edit label{display:block;font-size:11px;color:#52616b;min-width:0}.quick-edit label:nth-child(1),.quick-edit label:nth-child(2),.quick-edit label:nth-child(4){grid-column:1/-1}.quick-edit label:nth-child(3){display:none}.quick-edit label:nth-child(5){grid-column:1}.quick-edit label:nth-child(6){grid-column:2}.quick-edit label:nth-child(7){grid-column:1/-1}.quick-edit label:nth-child(8){grid-column:1/-1}.quick-edit input,.quick-edit select,.quick-edit textarea{display:block;width:100%;height:36px;min-height:36px;margin-top:3px;padding:6px;font-size:14px;background:white}.quick-edit textarea{height:60px;white-space:normal;resize:vertical}.quick-actions{grid-column:1/-1;grid-row:2;display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:flex-end}.quick-actions button{flex:1 1 110px;padding:9px 6px;font-size:12px}.quick-actions .open-details{background:#edf0f2;color:#1a2730}.quick-status{flex-basis:100%;font-size:12px;color:#236846}.item .details{padding:12px;border-top:1px solid #eee}.item:not(.expanded) .details{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid label{display:grid;gap:4px;font-size:12px}.wide{grid-column:1/-1}.category-input{margin-top:7px}.result{font-size:13px;color:#266b43}.hint{font-size:13px;color:#69747b}#status{white-space:pre-wrap;color:#a34223}a{color:#b93568}.item button{background:#e55b83}.item .open-details{background:#edf0f2;color:#1a2730}[hidden]{display:none!important}@media(min-width:850px){.product-row{grid-template-columns:48px minmax(0,1fr) 150px;align-items:center}.quick-edit{grid-column:2;grid-row:1;grid-template-columns:minmax(130px,1.3fr) minmax(100px,.8fr) minmax(170px,1.4fr) 80px 95px;align-items:center}.quick-edit label:nth-child(1){grid-column:1}.quick-edit label:nth-child(2){grid-column:2}.quick-edit label:nth-child(4){grid-column:3}.quick-edit label:nth-child(5){grid-column:4}.quick-edit label:nth-child(6){grid-column:5}.quick-edit label:nth-child(7){grid-column:1/-1}.quick-edit label:nth-child(8){grid-column:1/-1}.quick-actions{grid-column:3;grid-row:1;flex-direction:column}.quick-actions button{flex:auto;width:100%}.quick-status{flex-basis:auto}}</style></head><body><header>comple<span>mento.</span> <small style="font-size:13px;font-weight:400">Administración</small></header><main><h1>Productos</h1><p id="status">Verificando tu sesión…</p><section id="access" hidden><p>Iniciá sesión para administrar los productos.</p><p><a href="ingresar.html?v=panel-nuevo">Ir al inicio de sesión</a></p></section><section id="workspace" hidden><div class="row"><button id="new">+ Agregar producto</button><button id="logout">Cerrar sesión</button></div><div class="toolbar"><input id="searchProducts" type="search" placeholder="Buscar por nombre, marca o código…" autocomplete="off" aria-label="Buscar productos"><select id="categoryFilter" aria-label="Elegir categoría"><option value="all">Todas las categorías</option></select><select id="filterProducts" aria-label="Filtrar productos"><option value="all">Todos</option><option value="active">Visibles</option><option value="inactive">Ocultos</option><option value="featured">Destacados</option></select></div><p id="count" class="hint"></p><div id="items"></div></section></main><script src="supabase-config.js?v=2"></script><script>
const cfg=window.COMPLEMENTO_DB,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),token=sessionStorage.getItem('complemento_access_token')||localStorage.getItem('complemento_access_token')||'';
let products=[];const imageCache=new Map();async function loadPanelImages(){await Promise.all(products.map(async p=>{const src=p.image_data||p.image_url||'';if(!src.endsWith('.b64'))return;try{let data=imageCache.get(src);if(!data){const r=await fetch(src);if(!r.ok)throw Error('imagen');data='data:image/webp;base64,'+(await r.text()).replace(/\s/g,'');imageCache.set(src,data)}document.querySelectorAll('.item').forEach(el=>{if(Number(el.dataset.index)===products.indexOf(p)){const img=el.querySelector('.product-row img');if(img)img.src=data}})}catch(e){console.warn('No se pudo cargar imagen',src,e)}}))}
async function api(path,method='GET',body){const r=await fetch(cfg.url+'/rest/v1/'+path,{method,headers:{apikey:cfg.key,Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.text()).slice(0,300));return r.status===204?[]:r.json()}
const normalize=s=>String(s??'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLocaleLowerCase('es').replace(/[^a-z0-9]+/g,' ').trim();let expandedSku=null;const defaultCategories=['Librería','Juguetería','Regalería','Escolar','Arte y dibujo','Papelería','Oficina','Otros'];const categoryName=p=>String(p.category||'Sin categoría').trim()||'Sin categoría';function categories(){return [...new Set([...defaultCategories,...products.map(categoryName).filter(c=>c!=='Sin categoría')])].sort((a,b)=>a.localeCompare(b,'es'))}function refreshCategories(){const select=$('#categoryFilter'),previous=select.value;select.innerHTML='<option value="all">Todas las categorías</option>'+categories().map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')+'<option value="Sin categoría">Sin categoría</option>';select.value=[...select.options].some(o=>o.value===previous)?previous:'all'}function categoryOptions(current){return [...new Set([...categories(),current||'Sin categoría'])].map(c=>'<option value="'+esc(c)+'" '+(c===(current||'Sin categoría')?'selected':'')+'>'+esc(c)+'</option>').join('')+'<option value="__new__">+ Crear categoría nueva…</option>'}
function render(){const q=normalize($('#searchProducts').value),words=q.split(' ').filter(Boolean),filter=$('#filterProducts').value,cat=$('#categoryFilter').value;const matches=products.map((p,i)=>({p,i})).filter(({p})=>{const hay=normalize([p.name,p.sku,p.brand,p.category,p.description].join(' '));return words.every(w=>hay.includes(w))&&(cat==='all'||categoryName(p)===cat)&&(filter==='all'||filter==='active'&&p.active||filter==='inactive'&&!p.active||filter==='featured'&&p.featured)});$('#count').textContent=matches.length+' de '+products.length+' productos';let lastCategory='';const sorted=matches.sort((a,b)=>Number(!!b.p.__new)-Number(!!a.p.__new)||categoryName(a.p).localeCompare(categoryName(b.p),'es')||String(a.p.name).localeCompare(String(b.p.name),'es'));$('#items').innerHTML=sorted.map(({p,i})=>{const group=categoryName(p)===lastCategory?'':'<h2 class="category-heading">'+esc(categoryName(p))+'</h2>';lastCategory=categoryName(p);return group+'<article class="item '+(expandedSku===p.sku?'expanded':'')+'" data-index="'+i+'"><div class="product-row"><img class="thumb" data-product-image="'+i+'" src="'+esc(imageCache.get(p.image_url)||p.image_data||(String(p.image_url||'').endsWith('.b64')?'':p.image_url)||'')+'" alt="Foto del producto"><div class="quick-edit"><label class="full">Nombre<input data-quick="name" value="'+esc(p.name)+'"></label><label>Precio ($)<input type="number" min="0" data-quick="price" value="'+(Number(p.price)||0)+'"></label><label>Código<input value="'+esc(p.sku)+'" readonly title="Código del producto"></label><label class="full">Descripción<textarea data-quick="description">'+esc(p.description)+'</textarea></label><label>Categoría<select data-quick="category">'+categoryOptions(p.category)+'</select></label><label>Visible<select data-quick="active"><option value="true" '+(p.active?'selected':'')+'>Sí</option><option value="false" '+(!p.active?'selected':'')+'>No</option></select></label><label>Destacado<select data-quick="featured"><option value="true" '+(p.featured?'selected':'')+'>Sí</option><option value="false" '+(!p.featured?'selected':'')+'>No</option></select></label><label class="full">Foto<input type="file" accept="image/*" data-photo></label></div><div class="quick-actions"><span class="quick-status" aria-live="polite"></span><button type="button" data-quick-save="'+i+'">Guardar cambios</button><button type="button" class="open-details" data-toggle="'+i+'">'+(expandedSku===p.sku?'Cerrar opciones':'Más opciones')+'</button></div></div><div class="details"><div class="grid"><label class="wide">Nombre<input data-field="name" value="'+esc(p.name)+'"></label><label>Precio ($)<input type="number" min="0" data-field="price" value="'+(Number(p.price)||0)+'"></label><label>Stock<input type="number" min="0" data-field="stock" value="'+(p.stock??'')+'"></label><label>Marca<input data-field="brand" value="'+esc(p.brand)+'"></label><label>Categoría<select data-field="category">'+categoryOptions(p.category)+'</select><input class="category-input" data-category-new placeholder="Nombre de la nueva categoría" hidden></label><label class="wide">Descripción<textarea data-field="description">'+esc(p.description)+'</textarea></label><label class="wide">URL de imagen<input data-field="image_url" value="'+esc(p.image_url)+'"></label><label class="wide">Subir foto<input type="file" accept="image/*" data-photo></label><label>Visible<select data-field="active"><option value="true" '+(p.active?'selected':'')+'>Sí</option><option value="false" '+(!p.active?'selected':'')+'>No</option></select></label><label>Destacado<select data-field="featured"><option value="true" '+(p.featured?'selected':'')+'>Sí</option><option value="false" '+(!p.featured?'selected':'')+'>No</option></select></label></div><div class="row" style="margin-top:14px"><button data-save="'+i+'">Guardar producto</button></div><p class="result" aria-live="polite"></p></div></article>'}).join('')||'<p class="hint">No se encontraron productos con esa búsqueda.</p>';loadPanelImages()}
$('#searchProducts').addEventListener('input',render);$('#filterProducts').addEventListener('change',render);$('#categoryFilter').addEventListener('change',render);$('#items').addEventListener('change',e=>{if(e.target.matches('[data-field="category"]')){const field=e.target.closest('label').querySelector('[data-category-new]');field.hidden=e.target.value!=='__new__';if(!field.hidden)field.focus()}});
async function start(){try{if(!cfg)throw Error('No se cargó la configuración');if(!token){$('#status').textContent='Necesitás iniciar sesión.';$('#access').hidden=false;return}const rows=await api('complemento_admins?select=user_id&limit=1');if(!rows.length)throw Error('Esta cuenta no tiene permiso para administrar.');products=await api('complemento_products?select=*&order=name.asc');$('#workspace').hidden=false;refreshCategories();$('#status').textContent='Sesión iniciada correctamente. Los cambios se publican al guardar.';await loadPanelImages();render()}catch(e){$('#status').textContent='No se pudo abrir el panel: '+e.message;$('#access').hidden=false}}
$('#items').addEventListener('click',async e=>{const toggle=e.target.closest('[data-toggle]');if(toggle){const p=products[Number(toggle.dataset.toggle)];expandedSku=expandedSku===p.sku?null:p.sku;render();return}const quick=e.target.closest('[data-quick-save]');if(quick){const card=quick.closest('.item'),i=Number(quick.dataset.quickSave),p=products[i],get=k=>card.querySelector('[data-quick="'+k+'"]').value;const patch={name:get('name').trim(),description:get('description'),price:Number(get('price')),category:get('category'),active:get('active')==='true',featured:get('featured')==='true'};const status=card.querySelector('.quick-status');if(patch.category==='__new__'){status.textContent='Elegí una categoría existente o creá una en Más opciones.';return}if(!patch.name||!Number.isFinite(patch.price)||patch.price<0){status.textContent='Revisá nombre y precio';return}quick.disabled=true;status.textContent='Guardando…';try{const isNew=!!p.__new;const payload=isNew?{...patch,sku:p.sku,brand:p.brand||'',stock:p.stock??null,image_url:p.image_url||'',image_data:p.image_data||null}:patch;const saved=await api(isNew?'complemento_products':'complemento_products?sku=eq.'+encodeURIComponent(p.sku),isNew?'POST':'PATCH',payload);if(!Array.isArray(saved)||saved.length!==1)throw Error('El servidor no confirmó el guardado');products[i]=saved[0];status.textContent=isNew?'✓ Producto agregado correctamente':'✓ Guardado y publicado';}catch(err){status.textContent='Error: '+err.message}finally{quick.disabled=false}return}const btn=e.target.closest('[data-save]');if(!btn)return;const card=btn.closest('.item'),i=Number(btn.dataset.save),p=products[i],get=k=>card.querySelector('[data-field="'+k+'"]').value;const next={sku:p.sku,name:get('name').trim(),description:get('description'),price:Number(get('price')),stock:get('stock')===''?null:Number(get('stock')),brand:get('brand'),category:get('category')==='__new__'?card.querySelector('[data-category-new]').value.trim():get('category'),active:get('active')==='true',featured:get('featured')==='true',image_url:get('image_url'),image_data:p.image_data||null};if(!next.name||!Number.isFinite(next.price)||next.price<0){card.querySelector('.result').textContent='Ingresá un nombre y un precio válido.';return}if(!next.category){card.querySelector('.result').textContent='Elegí o escribí una categoría.';return}btn.disabled=true;card.querySelector('.result').textContent='Guardando…';try{const isNew=!!p.__new;const saved=await api(isNew?'complemento_products':'complemento_products?sku=eq.'+encodeURIComponent(p.sku),isNew?'POST':'PATCH',next);if(!Array.isArray(saved)||saved.length!==1)throw Error('El servidor no confirmó el guardado. No se guardó el producto.');products[i]=saved[0];card.querySelector('.result').textContent=isNew?'✓ Producto agregado correctamente. Ya está publicado.':'✓ Guardado en la base de datos. Actualizá la tienda para verlo.';const row=card.querySelector('.product-row');card.querySelector('[data-quick="name"]').value=saved[0].name;card.querySelector('[data-quick="price"]').value=saved[0].price;card.querySelector('[data-quick="description"]').value=saved[0].description||'';card.querySelector('[data-quick="active"]').value=String(saved[0].active);card.querySelector('[data-quick="featured"]').value=String(saved[0].featured);refreshCategories();if(isNew){expandedSku=saved[0].sku;render();const newCard=[...document.querySelectorAll('.item')].find(el=>products[Number(el.dataset.index)]?.sku===saved[0].sku);if(newCard)newCard.querySelector('.result').textContent='✓ Producto agregado correctamente.'}}catch(err){card.querySelector('.result').textContent='Error: '+err.message}finally{btn.disabled=false}});
$('#items').addEventListener('change',async e=>{if(!e.target.matches('[data-photo]')||!e.target.files[0])return;const card=e.target.closest('.item'),i=Number(card.dataset.index),file=e.target.files[0];try{const data=await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,640/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.7))};img.onerror=reject;img.src=url});products[i].image_data=data;const thumb=card.querySelector('.thumb');if(thumb)thumb.src=data;const message=card.querySelector('.quick-status');if(message)message.textContent='Foto preparada. Tocá Guardar cambios.';card.querySelector('.result').textContent='Foto preparada. Tocá Guardar producto.'}catch(err){card.querySelector('.result').textContent='No se pudo procesar la foto.'}});
$('#new').onclick=()=>{products.unshift({sku:'producto-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:'',price:0,stock:null,brand:'',category:'Escolar',description:'',active:true,featured:false,image_url:'',image_data:null,__new:true});expandedSku=null;$('#searchProducts').value='';$('#filterProducts').value='all';$('#categoryFilter').value='all';render();window.scrollTo(0,0)};
$('#logout').onclick=()=>{sessionStorage.removeItem('complemento_access_token');localStorage.removeItem('complemento_access_token');location.replace('ingresar.html')};start();
</script></body></html>
