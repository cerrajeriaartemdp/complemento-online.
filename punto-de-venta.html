<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complemento · Punto de Venta</title><style>body{font:15px system-ui,sans-serif;background:#f5f6f7;color:#19242a;margin:0}*{box-sizing:border-box}header{background:#fff;padding:16px;font-size:21px;font-weight:800;border-bottom:1px solid #ddd}header span{color:#e55b83}main{max-width:1100px;margin:auto;padding:14px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #ccd4d9;border-radius:8px;max-width:100%}input,select{width:100%}button{background:#18242a;color:white;cursor:pointer;border:0}#posPanel[hidden]{display:none}</style><script src="supabase-config.js?v=2"></script></head><body><header>comple<span>mento.</span> · Punto de Venta</header><main><p><a href="panel-complemento.html">← Volver a administración</a></p><p id="status">Verificando sesión…</p><div id="posOpen" hidden></div><section id="posPanel" hidden></section></main><script>

function printQuote(data,type='Comprobante de venta',popup=null){const w=popup||window.open('','_blank');if(!w){$('posStatus').textContent='Permití las ventanas emergentes para imprimir o guardar PDF.';return}const date=new Date(data.date||data.created_at).toLocaleString('es-AR');w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${safe(type)} · Complemento</title><style>@page{size:A4 portrait;margin:0}*{box-sizing:border-box}html,body{width:210mm;min-height:297mm;margin:0;padding:0;color:#000;background:#fff;font:12px Arial,sans-serif}.sheet{width:210mm;height:297mm;padding:13mm 14mm;display:flex;flex-direction:column;overflow:hidden}.brand{display:flex;justify-content:space-between;align-items:flex-start;border:2px solid #000;padding:11px 12px}.logo{font-size:26px;font-weight:800}.tag{border:2px solid #000;padding:9px;font-weight:800;font-size:16px;text-align:center}.info{display:grid;grid-template-columns:1fr 1fr;border:2px solid #000;border-top:0}.info>div{padding:11px;border-right:1px solid #000;min-height:100px}.info>div:last-child{border-right:0}h3{font-size:11px;text-transform:uppercase;margin:0 0 9px}p{margin:5px 0}.detail{flex:1;min-height:0;border:2px solid #000;border-top:0;display:flex;flex-direction:column}table{border-collapse:collapse;width:100%;table-layout:fixed}th{border-bottom:2px solid #000}td,th{padding:8px 6px;text-align:left;overflow-wrap:anywhere}th:nth-child(1){width:51%}th:nth-child(2){width:12%}th:nth-child(3){width:18%}th:nth-child(4){width:19%}td:last-child,th:last-child{text-align:right}tr{break-inside:avoid}.bottom{margin-top:auto;border-top:2px solid #000;padding:10px 12px}.total{display:flex;justify-content:space-between;align-items:center;border:2px solid #000;padding:12px;font-size:22px;font-weight:800}.note{font-size:10px;line-height:1.5;margin-top:9px}.foot{margin-top:10px;text-align:center;font-size:10px;font-weight:700}@media print{html,body{margin:0!important;padding:0!important}body{-webkit-p async function saveReceipt(){if(!items.length){alert('Agregá productos antes de generar un comprobante.');return null}if(savingReceipt)return null;savingReceipt=true;const x=snapshot();$('posSale').disabled=true;try{const rows=await api('complemento_pos_sales','POST',{customer:x.customer,address:x.address,cuit:x.cuit,phone:x.phone,payment:x.payment,notes:x.notes,items:x.items,total:x.total});if(!Array.isArray(rows)||!rows.length)throw Error('El servidor no confirmó el guardado');const saved={...rows[0],date:rows[0].created_at};items=[];render();await loadSales();$('posStatus').textContent='✓ Venta guardada. Elegí Ver, Descargar o Enviar PDF desde el historial. Stock sin cambios.';return saved}catch(e){$('posStatus').textContent='No se generó el comprobante porque la venta no se pudo guardar: '+e.message;return null}finally{savingReceipt=false;$('posSale').disabled=false}}

function receiptName(x){return 'Complemento-comprobante-'+String(x.id||'venta').slice(0,8)+'.pdf'}
async function pdfBlob(x){
 const encoder=new TextEncoder(),objects=[],pageIds=[],pages=[];
 const ascii=t=>String(t??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'?');
 const esc=t=>ascii(t).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
 const drawText=(t,xx,yy,size=10,bold=false)=>'BT /'+(bold?'F2':'F1')+' '+size+' Tf 1 0 0 1 '+xx+' '+yy+' Tm ('+esc(t)+') Tj ET\n';
 const rect=(xx,yy,w,h)=>xx+' '+yy+' '+w+' '+h+' re S\n';
 const line=(x1,y1,x2,y2)=>x1+' '+y1+' m '+x2+' '+y2+' l S\n';
 const width=t=>ascii(t).length*5.1;
 let commands='',y=580,page=0;
 function startPage(){
   if(page)pages.push(commands);
   page++;commands='0 G 0 g 0.8 w\n';
   commands+=rect(40,747,515,66);
   commands+=drawText('COMPLEMENTO',53,785,19,true)+drawText('San Luis 1365 - Mar del Plata',53,765,9);
   commands+=rect(397,763,145,40)+drawText('COMPROBANTE',409,786,12,true)+drawText('NO FISCAL',434,772,9,true);
   commands+=line(40,740,555,740);
   commands+=drawText('Fecha: '+new Date(x.date||x.created_at).toLocaleString('es-AR'),45,723,9);
   commands+=drawText('Referencia: '+String(x.id||'').slice(0,16),45,707,9);
   commands+=drawText('Pago: '+(x.payment||''),45,691,9);
   commands+=drawText('Cliente: '+(x.customer||'Consumidor final'),300,723,9);
   commands+=drawText('Direccion: '+(x.address||'No informada'),300,707,9);
   commands+=drawText('CUIT / documento: '+(x.cuit||'No informado'),300,691,9);
   commands+=line(40,677,555,677);
   commands+=drawText('Descripcion',45,660,10,true)+drawText('Cant.',373,660,10,true)+drawText('Precio',429,660,10,true)+drawText('Importe',494,660,10,true)+line(40,650,555,650);
   y=632;
 }
 startPage();
 for(const item of x.items||[]){
   const name=ascii(item.name||'Producto');
   const chunks=name.match(/.{1,55}/g)||[''];
   if(y-chunks.length*13<100)startPage();
   for(const chunk of chunks){commands+=drawText(chunk,45,y,9);y-=13;}
   commands+=drawText(item.qty,376,y+13,9)+drawText(money(item.price),417,y+13,9)+drawText(money(item.qty*item.price),482,y+13,9);
   y-=9;
 }
 commands+=line(40,93,555,93)+drawText('TOTAL',45,67,17,true)+drawText(money(x.total),408,67,17,true);
 commands+=drawText('Documento comercial no fiscal. No reemplaza una factura autorizada por ARCA.',42,38,8);
 pages.push(commands);
 function add(o){objects.push(o);return objects.length}
 const catalog=add('<< /Type /Catalog /Pages 2 0 R >>');
 const pagesRoot=add('');
 const font1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
 const font2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 for(const stream of pages){
   const bytes=encoder.encode(stream),contentId=add('<< /Length '+bytes.length+' >>\nstream\n'+stream+'endstream');
   const pageId=add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 '+font1+' 0 R /F2 '+font2+' 0 R >> >> /Contents '+contentId+' 0 R >>');
   pageIds.push(pageId);
 }
 objects[1]='<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>';
 let out='%PDF-1.4\n',offsets=[0];
 for(let i=0;i<objects.length;i++){offsets.push(encoder.encode(out).length);out+=(i+1)+' 0 obj\n'+objects[i]+'\nendobj\n'}
 const xref=encoder.encode(out).length;out+='xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n';
 for(let i=1;i<offsets.length;i++)out+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
 out+='trailer\n<< /Size '+(objects.length+1)+' /Root '+catalog+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';

}
function downloadPdfBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function receiptAction(x,action){
 try{
  const blob=await pdfBlob(x),name=receiptName(x),file=new File([blob],name,{type:'application/pdf'});
  if(action==='share'){
   if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Comprobante Complemento'});return}
   downloadPdfBlob(blob,name);
   $('posStatus').textContent='PDF descargado. Adjuntalo en WhatsApp como documento (este navegador no permite compartir archivos directamente).';
   return;
  }
  if(action==='view'){const url=URL.createObjectURL(blob);const w=window.open(url,'_blank');if(!w)downloadPdfBlob(blob,name);setTimeout(()=>URL.revokeObjectURL(url),60000);return}
  downloadPdfBlob(blob,name);
 }catch(err){if(err.name!=='AbortError')$('posStatus').textContent='No se pudo preparar el PDF: '+err.message}
}

$('posHistory').addEventListener('click',async e=>{
 const b=e.target.closest('[data-pos-action]');if(!b)return;
 const x=sales[Number(b.dataset.posIndex)];if(!x)return;
 if(b.dataset.posAction==='delete'){
  if(!confirm('¿Eliminar definitivamente esta venta del historial? Esta acción no se puede deshacer.'))return;
  b.disabled=true;
  try{await api('complemento_pos_sales?id=eq.'+encodeURIComponent(x.id),'DELETE');await loadSales();$('posStatus').textContent='Venta eliminada del historial.'}catch(err){$('posStatus').textContent='No se pudo eliminar: '+err.message;b.disabled=false}
 }else await receiptAction(x,b.dataset.posAction);
});
async function loadSales(){try{const rows=await api('complemento_pos_sales?select=*&order=created_at.desc&limit=500');sales=rows.map(x=>({...x,date:x.created_at}));history();$('posStatus').textContent='Ventas sincronizadas con el panel.'}catch(e){$('posStatus').textContent='No se pudo cargar el historial: '+e.message}}
$('posSale').onclick=async()=>{if(!items.length)return alert('Agregá productos primero.');if(!confirm('¿Generar la venta y guardarla en el historial? No se descontará stock.'))return;await saveReceipt()};
$('posClear').onclick=()=>{if(items.length&&!confirm('¿Vaciar la venta actual?'))return;items=[];render()};
$('posExport').onclick=()=>{const rows=[['Fecha','ID','Cliente','Teléfono','Pago','Código','Producto','Cantidad','Precio unitario','Subtotal','Total venta','Observaciones']];sales.forEach(s=>s.items.forEach(i=>rows.push([s.date||s.created_at,s.id,s.customer,s.phone,s.payment,i.sku,i.name,i.qty,i.price,i.qty*i.price,s.total,s.notes])));const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='complemento-ventas-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('posClose').onclick=()=>{root.hidden=true};$('posOpen').onclick=async()=>{root.hidden=false;root.scrollIntoView({behavior:'smooth',block:'start'});$('posStatus').textContent='Cargando productos…';try{catalog=await api('complemento_products?select=sku,name,description,price,active&order=name.asc');$('posStatus').textContent=catalog.length+' productos disponibles para buscar.';render();await loadSales();$('posSearch').focus()}catch(e){$('posStatus').textContent='No se pudieron cargar los productos: '+e.message}};render();history();
})();
</script></body></html>
