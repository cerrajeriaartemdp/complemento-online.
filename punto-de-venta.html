<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complemento · Punto de Venta</title><style>body{font:15px system-ui,sans-serif;background:#f5f6f7;color:#19242a;margin:0}*{box-sizing:border-box}header{background:#fff;padding:16px;font-size:21px;font-weight:800;border-bottom:1px solid #ddd}header span{color:#e55b83}main{max-width:1100px;margin:auto;padding:14px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #ccd4d9;border-radius:8px;max-width:100%}input,select{width:100%}button{background:#18242a;color:white;cursor:pointer;border:0}#posPanel[hidden]{display:none}</style><script src="supabase-config.js?v=2"></script></head><body><header>comple<span>mento.</span> · Punto de Venta</header><main><p><a href="panel-complemento.html">← Volver a administración</a></p><p id="status">Verificando sesión…</p><div id="posOpen" hidden></div><section id="posPanel" hidden></section></main><script>
const cfg=window.COMPLEMENTO_DB;
let token=localStorage.getItem('complemento_access_token')||sessionStorage.getItem('complemento_access_token')||'';
let refreshing=null;
async function refreshSession(){if(refreshing)return refreshing;refreshing=(async()=>{const rt=localStorage.getItem('complemento_refresh_token');if(!rt||!cfg)return false;try{const r=await fetch(cfg.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({refresh_token:rt})});if(!r.ok)return false;const d=await r.json();if(!d.access_token)return false;token=d.access_token;localStorage.setItem('complemento_access_token',token);sessionStorage.setItem('complemento_access_token',token);if(d.refresh_token)localStorage.setItem('complemento_refresh_token',d.refresh_token);return true}catch{return false}})();try{return await refreshing}finally{refreshing=null}}
async function api(path,method='GET',body){let r=await fetch(cfg.url+'/rest/v1/'+path,{method,headers:{apikey:cfg.key,Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(r.status===401&&await refreshSession())r=await fetch(cfg.url+'/rest/v1/'+path,{method,headers:{apikey:cfg.key,Authorization:'Bearer '+token}});if(!r.ok)throw Error((await r.text()).slice(0,250));return r.json()}
async function init(){try{if(!cfg)throw Error('Configuración no disponible');if(!token&&!(await refreshSession()))throw Error('Necesitás iniciar sesión en el panel.');const a=await api('complemento_admins?select=user_id&limit=1');if(!a.length)throw Error('Cuenta sin permiso de administración');document.getElementById('status').textContent='Sesión verificada · Las ventas no descuentan stock';document.getElementById('posOpen').click()}catch(e){document.getElementById('status').innerHTML='No se pudo abrir el Punto de Venta: '+String(e.message).replace(/</g,'&lt;')+' · <a href="ingresar.html">Iniciar sesión</a>'}}
window.addEventListener('load',init);
</script><script src="pos-complemento-v1.js?v=ceeb97a"></script></body></html>
