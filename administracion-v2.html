<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complemento · Panel</title><style>body{font:16px system-ui;background:#f5f6f7;color:#19242a;margin:0}header{background:white;padding:18px;border-bottom:1px solid #ddd;font-weight:800;font-size:23px}header span{color:#e55b83}main{max-width:900px;margin:auto;padding:20px}input,textarea,select,button{font:inherit;box-sizing:border-box;padding:12px;border:1px solid #ccd4d9;border-radius:10px;max-width:100%}input,textarea,select{width:100%}button{background:#18242a;color:white;cursor:pointer;border:0}button:disabled{opacity:.5}.item{background:white;border:1px solid #dce1e4;padding:16px;border-radius:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid label{font-size:13px;display:grid;gap:5px}.wide{grid-column:1/-1}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}#status{white-space:pre-wrap;color:#a34223}img{width:100px;height:100px;object-fit:contain}.item button{background:#e55b83}a{color:#b93568}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:180px;background:#fff}.toolbar select{width:auto;background:white}.category-heading{font-size:17px;margin:24px 0 9px;padding:10px 12px;background:#e9edf0;border-radius:10px}.category-input{margin-top:7px}.product-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;color:#19242a;border:0;padding:12px}.product-row img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#f6f6f6;flex:none}.product-row .meta{flex:1;min-width:0}.product-row strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.product-row small{display:block;color:#68747c;font-size:12px;margin-top:4px}.product-row .price{font-weight:800;white-space:nowrap}.item{padding:0;overflow:hidden;margin:8px 0}.item .details{padding:15px;border-top:1px solid #eee}.item:not(.expanded) .details{display:none}.item.expanded .product-row{background:#fff7fa}.result{font-size:13px;color:#266b43}.hint{font-size:13px;color:#69747b}@media(max-width:520px){main{padding:12px}.product-row{gap:8px;padding:10px}.product-row img{width:42px;height:42px}.grid{gap:8px}.product-row .price{font-size:14px}}[hidden]{display:none!important}</style></head><body><header>comple<span>mento.</span> <small style="font-size:13px;font-weight:400">Administración</small></header><main><h1>Productos</h1><p id="status">Verificando tu sesión…</p><section id="access" hidden><p>Iniciá sesión para administrar los productos.</p><p><a href="ingresar.html?v=panel-nuevo">Ir al inicio de sesión</a></p></section><section id="workspace" hidden><div class="row"><button id="new">+ Agregar producto</button><button id="logout">Cerrar sesión</button></div><div class="toolbar"><input id="searchProducts" type="search" placeholder="Buscar por nombre, marca o código…" autocomplete="off" aria-label="Buscar productos"><select id="categoryFilter" aria-label="Elegir categoría"><option value="all">Todas las categorías</option></select><select id="filterProducts" aria-label="Filtrar productos"><option value="all">Todos</option><option value="active">Visibles</option><option value="inactive">Ocultos</option><option value="featured">Destacados</option></select></div><p id="count" class="hint"></p><div id="items"></div></section></main><script>window.addEventListener("error",function(e){var x=document.getElementById("status");if(x)x.textContent="Error al abrir panel: "+e.message});window.addEventListener("unhandledrejection",function(e){var x=document.getElementById("status");if(x)x.textContent="Error de conexión: "+String(e.reason)});</script><script src="supabase-config.js?v=2"></script><script>
const cfg=window.COMPLEMENTO_DB,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),token=sessionStorage.getItem('complemento_access_token')||localStorage.getItem('complemento_access_token')||'';
let products=[];const imageCache=new Map();async function loadPanelImages(){await Promise.all(products.map(async p=>{const src=p.image_data||p.image_url||'';if(!src.endsWith('.b64'))return;try{let data=imageCache.get(src);if(!data){const r=await fetch(src);if(!r.ok)throw Error('imagen');data='data:image/webp;base64,'+(await r.text()).replace(/\s/g,'');imageCache.set(src,data)}document.querySelectorAll('.item').forEach(el=>{if(Number(el.dataset.index)===products.indexOf(p)){const img=el.querySelector('.product-row img');if(img)img.src=data}})}catch(e){console.warn('No se pudo cargar imagen',src,e)}}))}
async function api(path,method='GET',body){const r=await fetch(cfg.url+'/rest/v1/'+path,{method,headers:{apikey:cfg.key,Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.text()).slice(0,300));return r.status===204?[]:r.json()}
const normalize=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').replace(/[^a-z0-9]+/g,' ').trim();let expandedSku=null;const defaultCategories=['Librería','Juguetería','Regalería','Escolar','Arte y dibujo','Papelería','Oficina','Otros'];const categoryName=p=>String(p.category||'Sin categoría').trim()||'Sin categoría';function categories(){return [...new Set([...defaultCategories,...products.map(categoryName).filter(c=>c!=='Sin categoría')])].sort((a,b)=>a.localeCompare(b,'es'))}function refreshCategories(){const select=$('#categoryFilter'),previous=select.value;select.innerHTML='<option value="all">Todas las categorías</option>'+categories().map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')+'<option value="Sin categoría">Sin categoría</option>';select.value=[...select.options].some(o=>o.value===previous)?previous:'all'}function categoryOptions(current){return [...new Set([...categories(),current||'Sin categoría'])].map(c=>'<option value="'+esc(c)+'" '+(c===(current||'Sin categoría')?'selected':'')+'>'+esc(c)+'</option>').join('')+'<option value="__new__">+ Crear categoría nueva…</option>'}
function render(){const q=normalize($('#searchProducts').value),words=q.split(' ').filter(Boolean),filter=$('#filterProducts').value,cat=$('#categoryFilter').value;const matches=products.map((p,i)=>({p,i})).filter(({p})=>{const hay=normalize([p.name,p.sku,p.brand,p.category,p.description].join(' '));return words.every(w=>hay.includes(w))&&(cat==='all'||categoryName(p)===cat)&&(filter==='all'||filter==='active'&&p.active||filter==='inactive'&&!p.active||filter==='featured'&&p.featured)});$('#count').textContent=matches.length+' de '+products.length+' productos';let lastCategory='';const sorted=matches.sort((a,b)=>categoryName(a.p).localeCompare(categoryName(b.p),'es')||String(a.p.name).localeCompare(String(b.p.name),'es'));$('#items').innerHTML=sorted.map(({p,i})=>{const group=categoryName(p)===lastCategory?'':'<h2 class="category-heading">'+esc(categoryName(p))+'</h2>';lastCategory=categoryName(p);return group+'<article class="item '+(expandedSku===p.sku?'expanded':'')+'" data-index="'+i+'"><button type="button" class="product-row" data-toggle="'+i+'" aria-expanded="'+(expandedSku===p.sku)+'"><img src="'+esc(imageCache.get(p.image_url)||p.image_data||(String(p.image_url||'').endsWith('.b64')?'':p.image_url)||'')+'" alt="" loading="lazy"><span class="meta"><strong>'+esc(p.name||'Nuevo producto')+'</strong><small>'+esc(p.brand||p.category||'')+' · '+esc(p.sku)+(p.active?'':' · Oculto')+(p.featured?' · ★ Destacado':'')+'</small></span><span class="price">'+new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(p.price)||0)+'</span><span aria-hidden="true">'+(expandedSku===p.sku?'⌃':'⌄')+'</span></button><div class="details"><div class="grid"><label class="wide">Nombre<input data-field="name" value="'+esc(p.name)+'"></label><label>Precio ($)<input type="number" min="0" data-field="price" value="'+(Number(p.price)||0)+'"></label><label>Stock<input type="number" min="0" data-field="stock" value="'+(p.stock??'')+'"></label><label>Marca<input data-field="brand" value="'+esc(p.brand)+'"></label><label>Categoría<select data-field="category">'+categoryOptions(p.category)+'</select><input class="category-input" data-category-new placeholder="Nombre de la nueva categoría" hidden></label><label class="wide">Descripción<textarea data-field="description">'+esc(p.description)+'</textarea></label><label class="wide">URL de imagen<input data-field="image_url" value="'+esc(p.image_url)+'"></label><label class="wide">Subir foto<input type="file" accept="image/*" data-photo></label><label>Visible<select data-field="active"><option value="true" '+(p.active?'selected':'')+'>Sí</option><option value="false" '+(!p.active?'selected':'')+'>No</option></select></label><label>Destacado<select data-field="featured"><option value="true" '+(p.featured?'selected':'')+'>Sí</option><option value="false" '+(!p.featured?'selected':'')+'>No</option></select></label></div><div class="row" style="margin-top:14px"><button data-save="'+i+'">Guardar producto</button></div><p class="result" aria-live="polite"></p></div></article>'}).join('')||'<p class="hint">No se encontraron productos con esa búsqueda.</p>';loadPanelImages()}
$('#searchProducts').addEventListener('input',render);$('#filterProducts').addEventListener('change',render);$('#categoryFilter').addEventListener('change',render);$('#items').addEventListener('change',e=>{if(e.target.matches('[data-field="category"]')){const field=e.target.closest('label').querySelector('[data-category-new]');field.hidden=e.target.value!=='__new__';if(!field.hidden)field.focus()}});
async function start(){try{if(!cfg)throw Error('No se cargó la configuración');if(!token){$('#status').textContent='Necesitás iniciar sesión.';$('#access').hidden=false;return}const rows=await api('complemento_admins?select=user_id&limit=1');if(!rows.length)throw Error('Esta cuenta no tiene permiso para administrar.');products=await api('complemento_products?select=*&order=name.asc');$('#workspace').hidden=false;refreshCategories();$('#status').textContent='Sesión iniciada correctamente. Los cambios se publican al guardar.';render()}catch(e){$('#status').textContent='No se pudo abrir el panel: '+e.message;$('#access').hidden=false}}
$('#items').addEventListener('click',async e=>{const toggle=e.target.closest('[data-toggle]');if(toggle){const p=products[Number(toggle.dataset.toggle)];expandedSku=expandedSku===p.sku?null:p.sku;render();return}const btn=e.target.closest('[data-save]');if(!btn)return;const card=btn.closest('.item'),i=Number(btn.dataset.save),p=products[i],get=k=>card.querySelector('[data-field="'+k+'"]').value;const next={sku:p.sku,name:get('name'),description:get('description'),price:Number(get('price'))||0,stock:get('stock')===''?null:Number(get('stock')),brand:get('brand'),category:get('category')==='__new__'?card.querySelector('[data-category-new]').value.trim():get('category'),active:get('active')==='true',featured:get('featured')==='true',image_url:get('image_url'),image_data:p.image_data||null};if(!next.category){card.querySelector('.result').textContent='Elegí o escribí una categoría.';return}btn.disabled=true;card.querySelector('.result').textContent='Guardando…';try{const saved=await api('complemento_products?sku=eq.'+encodeURIComponent(p.sku),'PATCH',next);if(!Array.isArray(saved)||saved.length!==1)throw Error('El servidor no confirmó la actualización. No se guardó el cambio.');products[i]=saved[0];card.querySelector('.result').textContent='✓ Guardado en la base de datos. Actualizá la tienda para verlo.';const row=card.querySelector('.product-row');row.querySelector('strong').textContent=saved[0].name;row.querySelector('.price').textContent=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(saved[0].price)||0);refreshCategories()}catch(err){card.querySelector('.result').textContent='Error: '+err.message}finally{btn.disabled=false}});
$('#items').addEventListener('change',async e=>{if(!e.target.matches('[data-photo]')||!e.target.files[0])return;const card=e.target.closest('.item'),i=Number(card.dataset.index),file=e.target.files[0];try{const data=await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,640/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.7))};img.onerror=reject;img.src=url});products[i].image_data=data;card.querySelector('.result').textContent='Foto preparada. Tocá Guardar producto.'}catch(err){card.querySelector('.result').textContent='No se pudo procesar la foto.'}});
$('#new').onclick=()=>{products.unshift({sku:'producto-'+Date.now(),name:'Producto nuevo',price:0,stock:0,brand:'',category:'',description:'',active:false,featured:false,image_url:'',image_data:null});expandedSku=products[0].sku;$('#searchProducts').value='';$('#filterProducts').value='all';$('#categoryFilter').value='all';render();window.scrollTo(0,0)};
$('#logout').onclick=()=>{sessionStorage.removeItem('complemento_access_token');localStorage.removeItem('complemento_access_token');location.replace('ingresar.html')};start();
</script></body></html>
